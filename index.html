<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏫 자운고 사과게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF7ED;
      --card-bg: #FFFFFF;
      --apple-red: #FF4757;
      --apple-leaf: #2ED573;
      --accent-yellow: #FFA502;
      --accent-pink: #FF6B81;
      --font-main: 'Gaegu', 'Nunito', cursive, sans-serif;
      --text-color: #2F3542;
      --shadow: 0 8px 24px rgba(255, 71, 87, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #FFF5EB 0%, #FFE8E8 50%, #F3F0FF 100%);
      font-family: var(--font-main);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 24px 30px;
      box-shadow: 0 16px 40px rgba(245, 114, 114, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 4px solid #FFE3E3;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 950px;
      width: 100%;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 2.2rem;
      color: #FF4757;
      text-shadow: 2px 2px 0px #FFD2D2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #747D8C;
      font-weight: 700;
    }

    /* Scoreboard */
    .dashboard {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: #FFF;
      border: 2px solid #FFD2D2;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #2F3542;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
    }

    .stat-badge .icon {
      font-size: 1.5rem;
    }

    .stat-badge.timer.warning {
      border-color: #FF4757;
      color: #FF4757;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.07);
      }
    }

    .stat-badge.target-sum {
      background: #FFEAA7;
      border-color: #FDCB6E;
      color: #D35400;
      font-size: 1.35rem;
      min-width: 110px;
      justify-content: center;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      font-family: var(--font-main);
      font-size: 1.3rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: #FF4757;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.35);
    }

    .btn-primary:hover {
      background: #FF6B81;
    }

    .btn-secondary {
      background: #FFA502;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 165, 2, 0.3);
    }

    .btn-secondary:hover {
      background: #ECCC68;
    }

    .btn-restart {
      background: #70A1FF;
      color: white;
      box-shadow: 0 4px 12px rgba(112, 161, 255, 0.3);
    }

    .btn-restart:hover {
      background: #1E90FF;
    }

    /* Game Board Wrapper */
    .game-board-container {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 3px dashed #FFCCD2;
      background: #FFFDF9;
      padding: 8px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    #gameCanvas {
      display: block;
      cursor: crosshair;
      border-radius: 14px;
    }

    /* Pause Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
      z-index: 10;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-title {
      font-size: 2.5rem;
      color: #FF4757;
      text-shadow: 2px 2px 0px #FFE0E0;
    }

    .overlay-msg {
      font-size: 1.5rem;
      color: #57606F;
    }

    /* Help guide footer */
    .footer-help {
      margin-top: 14px;
      font-size: 1.15rem;
      color: #747D8C;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Confetti particle canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>🏫 자운고 사과게임</h1>
        <span class="subtitle">합이 10이 되도록 드래그하세요!</span>
      </div>

      <div class="btn-group">
        <button id="pauseBtn" class="btn-secondary">⏸ 일시정지</button>
        <button id="restartBtn" class="btn-restart">🔄 다시하기</button>
      </div>
    </header>

    <div class="dashboard">
      <div class="stat-badge">
        <span class="icon">⏱</span>
        <span>시간: <strong id="timerText">02:00</strong></span>
      </div>

      <div class="stat-badge">
        <span class="icon">⭐</span>
        <span>점수: <strong id="scoreText">0</strong></span>
      </div>

      <div class="stat-badge">
        <span class="icon">🏆</span>
        <span>최고점수: <strong id="highScoreText">0</strong></span>
      </div>

      <div class="stat-badge target-sum">
        <span>선택 합: <strong id="currentSumText">0</strong> / 10</span>
      </div>
    </div>

    <div class="game-board-container" style="margin-top: 14px;">
      <canvas id="gameCanvas" width="850" height="500"></canvas>

      <!-- 일시정지 오버레이 -->
      <div id="pauseOverlay" class="overlay">
        <div class="overlay-title">⏸ 잠시 휴식 중!</div>
        <div class="overlay-msg">자운고 마크들이 잠시 휴식 중이에요 🏫</div>
        <button id="resumeBtn" class="btn-primary" style="font-size: 1.5rem; padding: 10px 24px;">▶ 계속하기</button>
      </div>

      <!-- 게임오버 / 결과 오버레이 -->
      <div id="gameOverOverlay" class="overlay">
        <div class="overlay-title" id="gameOverTitle">🎉 게임 종료!</div>
        <div class="overlay-msg" id="gameOverScoreText">획득 점수: 0개</div>
        <button id="playAgainBtn" class="btn-primary" style="font-size: 1.5rem; padding: 10px 24px;">✨ 다시 도전하기</button>
      </div>
    </div>

    <div class="footer-help">
      💡 <span>마우스나 터치로 드래그하여 상자 안 숫자들의 합이 정확히 <strong>10</strong>이 되면 마크가 사라집니다!</span>
    </div>
  </div>

    // --- 오디오 신디사이저 (Web Audio API 기반 귀여운 효과음 - 외부 파일 불필요) ---
    const AudioController = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playPop() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) { }
      },
      playSuccess() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0.22, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.25);
          });
        } catch (e) { }
      },
      playGameOver() {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [440, 392, 349.23, 261.63].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.12);
            gain.gain.setValueAtTime(0.2, now + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.12);
            osc.stop(now + i * 0.12 + 0.2);
          });
        } catch (e) { }
      }
    };

    // --- 게임 환경 설정 ---
    const COLS = 17;
    const ROWS = 10;
    const TOTAL_TIME = 120; // 2분
    const HIGH_SCORE_KEY = 'apple_game_high_score_val';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL_WIDTH = canvas.width / COLS;
    const CELL_HEIGHT = canvas.height / ROWS;

    // DOM 참조
    const timerText = document.getElementById('timerText');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const currentSumText = document.getElementById('currentSumText');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const resumeBtn = document.getElementById('resumeBtn');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverScoreText = document.getElementById('gameOverScoreText');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // 게임 상태
    let grid = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0', 10);
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let isPaused = false;
    let isGameOver = false;

    // 드래그 상태
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;
    let selectedCells = [];

    // 파티클 시스템
    let particles = [];

    // 자운고 마크 위 선명한 숫자 뱃지 그리기
    function drawNumberBadge(x, y, radius, num, isSelected) {
      const badgeR = radius * 0.52;

      // 중앙 반투명 원형 뱃지 배경 (숫자 가독성 확보)
      ctx.save();
      ctx.fillStyle = isSelected ? 'rgba(255, 245, 200, 0.94)' : 'rgba(255, 255, 255, 0.88)';
      ctx.beginPath();
      ctx.arc(x, y, badgeR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = isSelected ? '#E67E22' : '#832149';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 숫자 그리기
      ctx.fillStyle = isSelected ? '#D35400' : '#832149';
      ctx.font = 'bold ' + Math.round(radius * 0.85) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(num, x, y + 1);
      ctx.restore();
    }

    // 그리드 초기화
    function initGrid() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            r,
            c,
            number: Math.floor(Math.random() * 9) + 1, // 1 ~ 9
            active: true,
            scale: 1, // 팝업 애니메이션용
            bursting: false
          });
        }
      }
      grid = row;
    }

    // 보드 재생성 (전체 매트릭스)
    function setupBoard() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            r,
            c,
            number: Math.floor(Math.random() * 9) + 1,
            active: true,
            scale: 1,
            bursting: false
          });
        }
        grid.push(row);
      }
    }

    // 시간 포맷 (00:00)
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateScoreboard() {
      timerText.textContent = formatTime(timeLeft);
      scoreText.textContent = score;
      highScoreText.textContent = highScore;

      const timerBadge = timerText.closest('.stat-badge');
      if (timeLeft <= 20) {
        timerBadge.classList.add('warning');
      } else {
        timerBadge.classList.remove('warning');
      }
    }

    // 파티클 생성
    function spawnParticles(x, y, count = 12) {
      const colors = ['#FF4757', '#FFA502', '#2ED573', '#FF6B81', '#70A1FF', '#FFF'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          life: 1
        });
      }
    }

    // 화면 렌더링
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 격자 배경 은은한 도트 패턴
      ctx.fillStyle = '#FFFBF7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 사과들 그리기
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const apple = grid[r][c];
          if (!apple.active) continue;

          const cx = c * CELL_WIDTH + CELL_WIDTH / 2;
          const cy = r * CELL_HEIGHT + CELL_HEIGHT / 2;
          const radius = Math.min(CELL_WIDTH, CELL_HEIGHT) * 0.40;

          // 선택 여부 확인
          const isSelected = selectedCells.some(cell => cell.r === r && cell.c === c);

          ctx.save();
          ctx.translate(cx, cy);

          if (isSelected) {
            ctx.scale(1.12, 1.12);
          }

          // 그림자
          ctx.shadowColor = isSelected ? 'rgba(255, 71, 87, 0.4)' : 'rgba(0, 0, 0, 0.08)';
          ctx.shadowBlur = isSelected ? 12 : 5;
          ctx.shadowOffsetY = 3;



          // 자운고 마크 원형 클리핑 & 그리기
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          if (isLogoLoaded) {
            ctx.drawImage(logoImg, -radius, -radius, radius * 2, radius * 2);
          } else {
            ctx.fillStyle = '#832149';
            ctx.fill();
          }

          if (isSelected) {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.35)'; // 선택 시 금빛 하이라이트
            ctx.fill();
          }
          ctx.restore();

          // 마크 외곽 테두리 링
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.lineWidth = isSelected ? 3.5 : 2;
          ctx.strokeStyle = isSelected ? '#FFD700' : '#832149';
          ctx.stroke();

          // 숫자 뱃지 그리기 (가운데 선명하게 노출)
          drawNumberBadge(0, 0, radius, apple.number, isSelected);

          ctx.restore();
        }
      }

      // 드래그 중인 선택 박스 그리기
      if (isDragging) {
        const x = Math.min(dragStartX, dragCurrentX);
        const y = Math.min(dragStartY, dragCurrentY);
        const w = Math.abs(dragCurrentX - dragStartX);
        const h = Math.abs(dragCurrentY - dragStartY);

        ctx.save();
        ctx.strokeStyle = '#FF4757';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = 'rgba(255, 71, 87, 0.12)';
        ctx.fillRect(x, y, w, h);
        ctx.restore();
      }

      // 파티클 렌더링
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // 중력
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    // 좌표를 캔버스 기준 좌표로 변환
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // 드래그 영역 내 포함된 사과들 계산
    function calculateSelectedCells() {
      if (!isDragging) return;

      const minX = Math.min(dragStartX, dragCurrentX);
      const maxX = Math.max(dragStartX, dragCurrentX);
      const minY = Math.min(dragStartY, dragCurrentY);
      const maxY = Math.max(dragStartY, dragCurrentY);

      selectedCells = [];
      let sum = 0;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const apple = grid[r][c];
          if (!apple.active) continue;

          const cellLeft = c * CELL_WIDTH;
          const cellRight = cellLeft + CELL_WIDTH;
          const cellTop = r * CELL_HEIGHT;
          const cellBottom = cellTop + CELL_HEIGHT;

          // 중심점이 사각형 안에 들어오는지 또는 사각형이 겹치는지 체크
          const centerX = (cellLeft + cellRight) / 2;
          const centerY = (cellTop + cellBottom) / 2;

          const overlaps = !(cellRight < minX || cellLeft > maxX || cellBottom < minY || cellTop > maxY);

          if (overlaps) {
            selectedCells.push(apple);
            sum += apple.number;
          }
        }
      }

      currentSumText.textContent = sum;
      if (sum === 10) {
        currentSumText.style.color = '#2ED573';
      } else if (sum > 10) {
        currentSumText.style.color = '#FF4757';
      } else {
        currentSumText.style.color = '#D35400';
      }
    }

    // 마우스/터치 이벤트 핸들러
    function handlePointerDown(e) {
      if (isPaused || isGameOver) return;
      AudioController.init();

      const pos = getCanvasCoordinates(e);
      isDragging = true;
      dragStartX = pos.x;
      dragStartY = pos.y;
      dragCurrentX = pos.x;
      dragCurrentY = pos.y;
      calculateSelectedCells();
    }

    function handlePointerMove(e) {
      if (!isDragging || isPaused || isGameOver) return;
      const pos = getCanvasCoordinates(e);
      dragCurrentX = pos.x;
      dragCurrentY = pos.y;
      calculateSelectedCells();
    }

    function handlePointerUp() {
      if (!isDragging || isPaused || isGameOver) return;
      isDragging = false;

      // 선택된 사과의 합 계산
      let sum = 0;
      selectedCells.forEach(apple => {
        sum += apple.number;
      });

      if (sum === 10) {
        // 성공! 사과 제거 및 점수 획득
        AudioController.playSuccess();
        const removedCount = selectedCells.length;
        score += removedCount;

        selectedCells.forEach(apple => {
          apple.active = false;
          const cx = apple.c * CELL_WIDTH + CELL_WIDTH / 2;
          const cy = apple.r * CELL_HEIGHT + CELL_HEIGHT / 2;
          spawnParticles(cx, cy, 8);
        });

        // 최고 기록 갱신
        if (score > highScore) {
          highScore = score;
          localStorage.setItem(HIGH_SCORE_KEY, highScore.toString());
        }

        updateScoreboard();
        checkBoardClear();
      } else {
        if (selectedCells.length > 0) {
          AudioController.playPop();
        }
      }

      selectedCells = [];
      currentSumText.textContent = '0';
      currentSumText.style.color = '#D35400';
    }

    // 보드가 다 비워졌는지 확인 (올클리어 보너스)
    function checkBoardClear() {
      let remaining = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].active) remaining++;
        }
      }

      if (remaining === 0) {
        triggerConfetti();
        endGame('🎉 축하합니다! 완벽 클리어! 🎉');
      }
    }

    // 타이머 루프
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isPaused || isGameOver) return;

        timeLeft--;
        updateScoreboard();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame('⏰ 타임 오버! 시간이 모두 끝났어요!');
        }
      }, 1000);
    }

    // 게임 종료
    function endGame(title) {
      isGameOver = true;
      AudioController.playGameOver();
      gameOverTitle.textContent = title;
      gameOverScoreText.innerHTML = `최종 획득 점수: <strong>${score}점</strong><br>(최고 기록: ${highScore}점)`;
      gameOverOverlay.classList.add('active');
    }

    // 일시정지 토글
    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseOverlay.classList.add('active');
        pauseBtn.textContent = '▶ 계속하기';
      } else {
        pauseOverlay.classList.remove('active');
        pauseBtn.textContent = '⏸ 일시정지';
      }
    }

    // 새 게임 시작
    function resetGame() {
      score = 0;
      timeLeft = TOTAL_TIME;
      isPaused = false;
      isGameOver = false;
      isDragging = false;
      selectedCells = [];
      currentSumText.textContent = '0';

      pauseOverlay.classList.remove('active');
      gameOverOverlay.classList.remove('active');
      pauseBtn.textContent = '⏸ 일시정지';

      setupBoard();
      updateScoreboard();
      startTimer();
    }

    // 간단한 폭죽/컨페티 이펙트
    function triggerConfetti() {
      const cCanvas = document.getElementById('confettiCanvas');
      const cCtx = cCanvas.getContext('2d');
      cCanvas.width = window.innerWidth;
      cCanvas.height = window.innerHeight;

      const confettis = [];
      for (let i = 0; i < 100; i++) {
        confettis.push({
          x: Math.random() * cCanvas.width,
          y: Math.random() * cCanvas.height - cCanvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 100,
          color: `hsl(${Math.random() * 360}, 90%, 65%)`,
          tilt: Math.random() * 10 - 10,
          tiltAngle: 0,
          tiltAngleIncremental: Math.random() * 0.08 + 0.05
        });
      }

      let animationFrames = 0;
      function renderConfetti() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        confettis.forEach((p) => {
          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.5;
          p.x += Math.sin(p.tiltAngle);
          cCtx.beginPath();
          cCtx.lineWidth = p.r / 2;
          cCtx.strokeStyle = p.color;
          cCtx.moveTo(p.x + p.tilt + p.r / 4, p.y);
          cCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
          cCtx.stroke();
        });

        animationFrames++;
        if (animationFrames < 180) {
          requestAnimationFrame(renderConfetti);
        } else {
          cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        }
      }
      renderConfetti();
    }

    // 이벤트 리스너 등록
    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointerDown(e);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isDragging) {
        handlePointerMove(e);
      }
    }, { passive: false });

    window.addEventListener('touchend', handlePointerUp);

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);
    playAgainBtn.addEventListener('click', resetGame);

    // 초기 실행
    resetGame();
    draw();
  </script>
</body>
